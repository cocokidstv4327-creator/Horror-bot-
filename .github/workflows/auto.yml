name: horror-auto

on:
  schedule:
    - cron: "30 2 * * *"
    - cron: "30 6 * * *"
    - cron: "30 10 * * *"
    - cron: "30 13 * * *"
    - cron: "30 15 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "short ya long"
        type: choice
        options: [short, long]
        default: short
      dry_run:
        description: "1 = sirf video banao, upload mat karo"
        default: "0"

permissions:
  contents: write

concurrency:
  group: horror-auto
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          pip install -r requirements.txt

      - name: Decide mode
        id: m
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
            echo "dry=${{ github.event.inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 13 * * *" ]; then
            echo "mode=long" >> "$GITHUB_OUTPUT"
            echo "dry=0" >> "$GITHUB_OUTPUT"
          else
            echo "mode=short" >> "$GITHUB_OUTPUT"
            echo "dry=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Make video and upload
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          DRY_RUN: ${{ steps.m.outputs.dry }}
        run: python main.py ${{ steps.m.outputs.mode }}

      - name: Save history
        run: |
          git config user.name "horror-bot"
          git config user.email "horror-bot@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || (git commit -m "update history" && git pull --rebase && git push)
