name: horror-auto

on:
  schedule:
    - cron: "30 2 * * *"
    - cron: "0 10 */2 * *"
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "short ya long"
        type: choice
        options: [short, long]
        default: short
      dry_run:
        description: "1 = sirf video banao (upload nahi), 0 = upload karo"
        default: "0"
      privacy:
        description: "public / unlisted / private"
        type: choice
        options: [public, unlisted, private]
        default: public

permissions:
  contents: write

concurrency:
  group: horror-auto
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        timeout-minutes: 15
        run: |
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core)
          pip install -r requirements.txt

      - name: Decide mode
        id: m
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
            echo "dry=${{ github.event.inputs.dry_run }}" >> "$GITHUB_OUTPUT"
            echo "privacy=${{ github.event.inputs.privacy }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 10 */2 * *" ]; then
            echo "mode=long" >> "$GITHUB_OUTPUT"
            echo "dry=0" >> "$GITHUB_OUTPUT"
            echo "privacy=public" >> "$GITHUB_OUTPUT"
          else
            echo "mode=short" >> "$GITHUB_OUTPUT"
            echo "dry=0" >> "$GITHUB_OUTPUT"
            echo "privacy=public" >> "$GITHUB_OUTPUT"
          fi

      - name: Make video and upload
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
          DRY_RUN: ${{ steps.m.outputs.dry }}
          PRIVACY: ${{ steps.m.outputs.privacy }}
        run: python main.py ${{ steps.m.outputs.mode }}

      - name: Keep sample files (only for dry runs)
        if: ${{ steps.m.outputs.dry == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: sample
          path: |
            work/final.mp4
            work/thumb.jpg
          retention-days: 2
          if-no-files-found: ignore

      - name: Save history
        run: |
          git config user.name "horror-bot"
          git config user.email "horror-bot@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || (git commit -m "update history" && git pull --rebase && git push)
